name: CI
on:
  push:
    branches: [master, 'work/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: echosphere_test
          POSTGRES_USER: echosphere
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echosphere -d echosphere_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: echosphere_test
      POSTGRES_USER: echosphere
      POSTGRES_PASSWORD: ci_only
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
        working-directory: .
  portal-backend:
    runs-on: ubuntu-latest
    services:
      accounts:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: echosphere_accounts_test
          POSTGRES_USER: echosphere_accounts
          POSTGRES_PASSWORD: portal_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echosphere_accounts -d echosphere_accounts_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PORTAL_POSTGRES_DB: echosphere_accounts_test
      PORTAL_POSTGRES_USER: echosphere_accounts
      PORTAL_POSTGRES_PASSWORD: portal_ci_only
      RUN_DB_TESTS: '1'
    defaults:
      run:
        working-directory: portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
  portal-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T backend alembic upgrade head
      - run: docker compose exec -T backend alembic check
      - run: docker compose exec -T backend alembic upgrade head
      - run: docker compose exec -T worker python -m app.simulation.worker --once --limit 5
      - run: docker compose exec -T worker python -c "from app.colony.rules import load_ruleset; assert load_ruleset().version == 'v0.1'"
      - run: docker compose exec -T portal-backend alembic check
      - run: python3 scripts/smoke_compose.py
      - run: python3 scripts/smoke_portal_compose.py
      - if: always()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
