name: echosphere
x-backend: &backend
  image: echosphere-backend:dev
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    TRUSTED_PROXY_HOST: local-edge
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    TZ: UTC
x-portal: &portal
  image: echosphere-portal:dev
  build: ./portal/backend
  environment:
    PORTAL_POSTGRES_HOST: portal-postgres
    PORTAL_POSTGRES_DB: ${PORTAL_POSTGRES_DB:-echosphere_accounts}
    PORTAL_POSTGRES_USER: ${PORTAL_POSTGRES_USER:-echosphere_accounts}
    PORTAL_POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:-accounts_development_only}
    TZ: UTC
    PORTAL_MAIL_KEY_FILE: /run/portal-secrets/email.key
    PORTAL_PUBLIC_ORIGIN: https://portal.echosphere.localhost:8443
    PORTAL_TRUSTED_PROXY_HOST: local-edge
  volumes:
    - portal_secrets:/run/portal-secrets:ro
  networks: [portal_db]
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    volumes:
      - game_handoff:/run/game-handoff:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      handoff-keys-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
  worker:
    <<: *backend
    command: ["python", "-m", "app.simulation.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  portal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PORTAL_POSTGRES_DB:-echosphere_accounts}
      POSTGRES_USER: ${PORTAL_POSTGRES_USER:-echosphere_accounts}
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:-accounts_development_only}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - accounts_data:/var/lib/postgresql/data
    networks: [portal_db]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  portal-secrets-init:
    <<: *portal
    command: ["python", "-m", "portal_app.core.init_secrets"]
    volumes:
      - portal_secrets:/run/portal-secrets
    networks: [portal_db]
  portal-migrate:
    <<: *portal
    command: ["alembic", "upgrade", "head"]
    depends_on:
      portal-postgres:
        condition: service_healthy
  portal-backend:
    <<: *portal
    volumes:
      - portal_secrets:/run/portal-secrets:ro
      - portal_handoff:/run/portal-handoff:ro
    networks: [portal_db, portal_web]
    depends_on:
      handoff-keys-init:
        condition: service_completed_successfully
      portal-migrate:
        condition: service_completed_successfully
      portal-secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
  portal-frontend:
    build: ./portal/frontend
    environment:
      PORTAL_API_PROXY_TARGET: http://portal-backend:8000
    networks: [portal_web]
    depends_on:
      portal-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  portal-mailpit:
    image: axllent/mailpit:latest
    command: ["--disable-version-check"]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - portal_mail_data:/data
    networks: [portal_mail]
  portal-mail-worker:
    <<: *portal
    command: ["python", "-m", "portal_app.delivery.worker"]
    environment:
      PORTAL_POSTGRES_HOST: portal-postgres
      PORTAL_POSTGRES_DB: ${PORTAL_POSTGRES_DB:-echosphere_accounts}
      PORTAL_POSTGRES_USER: ${PORTAL_POSTGRES_USER:-echosphere_accounts}
      PORTAL_POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:-accounts_development_only}
      PORTAL_MAIL_KEY_FILE: /run/portal-secrets/email.key
      PORTAL_MAIL_TRANSPORT: smtp_local
      PORTAL_MAIL_HOST: portal-mailpit
      PORTAL_PUBLIC_ORIGIN: https://portal.echosphere.localhost:8443
    networks: [portal_db, portal_mail]
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
      portal-secrets-init:
        condition: service_completed_successfully
      portal-mailpit:
        condition: service_started
    restart: unless-stopped
  handoff-keys-init:
    <<: *portal
    user: "0:0"
    command: ["python", "-m", "portal_app.core.init_handoff"]
    volumes:
      - portal_handoff:/run/portal-handoff
      - game_handoff:/run/game-handoff
    networks: [portal_db]
  control-tls-init:
    <<: *portal
    user: "0:0"
    command: ["python", "-m", "portal_app.core.init_control_tls"]
    volumes:
      - control_ca:/run/control-ca
      - game_control_tls:/run/game-control
      - portal_control_tls:/run/portal-control
    networks: [control]
  game-control:
    <<: *backend
    command: ["python", "-m", "app.control.http"]
    networks: [default, control]
    volumes:
      - game_control_tls:/run/game-control:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      control-tls-init:
        condition: service_completed_successfully
    restart: unless-stopped
  portal-control-worker:
    <<: *portal
    command: ["python", "-m", "portal_app.control.worker"]
    networks: [portal_db, control]
    volumes:
      - portal_control_tls:/run/portal-control:ro
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
      control-tls-init:
        condition: service_completed_successfully
      game-control:
        condition: service_started
    restart: unless-stopped
  local-edge:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8025:8025"
    volumes:
      - ./infra/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - local_tls_data:/data
      - local_tls_config:/config
    networks: [default, portal_web, portal_mail]
    depends_on:
      frontend:
        condition: service_healthy
      portal-frontend:
        condition: service_healthy

volumes:
  postgres_data:
  accounts_data:
  local_tls_data:
  local_tls_config:
  portal_secrets:
  portal_mail_data:
  control_ca:
  game_control_tls:
  portal_control_tls:
  portal_handoff:
  game_handoff:
networks:
  default:
  portal_web:
  portal_db:
    internal: true
  portal_mail:
    internal: true
  control:
    internal: true
