name: CI
# Two levels, one workflow, one run per event:
# - pull_request to master: Fast CI (lint, pure tests without PostgreSQL, builds, docs,
#   static Compose/whitespace checks). Developer feedback, not a full game acceptance.
# - push to master (after a merge): Full CI, the exhaustive proof (PostgreSQL suites,
#   Chromium, real Compose startup, migrations and every recipe including AI and Combat).
# A regression only these exhaustive checks can catch is found after the merge, on master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      # Temporary (02/11/2026): 13B (PR #17) depends on the unmerged step 13 branch (PR #16).
      # Fast CI only; Full CI stays reserved to pushes on master. Remove once #16 is merged.
      - work/step-13-ai-relations
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR commit supersedes the previous Fast CI; a master Full CI always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Full CI only: an empty image never starts the service on pull requests.
        image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: echosphere_test
          POSTGRES_USER: echosphere
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echosphere -d echosphere_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: echosphere_test
      POSTGRES_USER: echosphere
      POSTGRES_PASSWORD: ci_only
      # Fast CI: PostgreSQL tests skip through the existing RUN_DB_TESTS gate.
      RUN_DB_TESTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
        working-directory: .
  portal-backend:
    runs-on: ubuntu-24.04
    services:
      accounts:
        image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: echosphere_accounts_test
          POSTGRES_USER: echosphere_accounts
          POSTGRES_PASSWORD: portal_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echosphere_accounts -d echosphere_accounts_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PORTAL_POSTGRES_DB: echosphere_accounts_test
      PORTAL_POSTGRES_USER: echosphere_accounts
      PORTAL_POSTGRES_PASSWORD: portal_ci_only
      RUN_DB_TESTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '1' || '0' }}
    defaults:
      run:
        working-directory: portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
  portal-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm run test:e2e
  static-checks:
    # Fast CI only: cheap static checks; never `docker compose up` nor an image build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Frozen Alembic DDL keeps the compiled SQL verbatim (trailing spaces included, as in
      # earlier revisions); it is checked by `alembic check` in Full CI, not rewritten here.
      - run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD -- . ':(exclude)backend/migrations/versions/*'
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile ai config --quiet
  compose-smoke:
    # Full CI only: real startup, migrations and every recipe, after a merge on master.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T backend alembic upgrade head
      - run: docker compose exec -T backend alembic check
      - run: docker compose exec -T backend alembic upgrade head
      - run: docker compose exec -T worker python -m app.simulation.worker --once --limit 5
      - run: docker compose exec -T worker python -c "from app.colony.rules import load_ruleset; assert load_ruleset().version == 'v0.1'"
      - run: docker compose exec -T portal-backend alembic check
      - run: docker compose --profile ai config --quiet
      - run: docker compose exec -T worker python -m app.ai.worker --blocked
      - run: docker compose exec -T combat-worker python -m app.combat.worker --blocked
      - run: python3 scripts/smoke_compose.py
      - run: python3 scripts/smoke_portal_compose.py
      - run: python3 scripts/smoke_control_compose.py
      - run: python3 scripts/smoke_handoff_compose.py
      - run: python3 scripts/smoke_colony_compose.py
      - run: python3 scripts/smoke_research_compose.py
      - run: python3 scripts/smoke_galaxy_compose.py
      - run: python3 scripts/smoke_fleet_compose.py
      - run: python3 scripts/smoke_colonization_compose.py
      - run: python3 scripts/smoke_ai_compose.py
      - run: python3 scripts/smoke_combat_compose.py
      - run: python3 scripts/smoke_relations_compose.py
      - run: python3 scripts/smoke_frontier_compose.py
      - if: always()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
