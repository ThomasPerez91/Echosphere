<text x="940" y="144" font-size="11.5" fill="#46566a">1. Système sélectionné : Lyra (cartographié)</text>
<text x="940" y="161" font-size="11.5" fill="#46566a">   Planètes connues · vos flottes ici</text>
<text x="940" y="178" font-size="11.5" fill="#46566a">2. Actions possibles (désactivées = raison) :</text>
<text x="940" y="195" font-size="11.5" fill="#46566a">   [Déplacer une flotte] [Coloniser…] [Attaquer…]</text>
<text x="940" y="212" font-size="11.5" fill="#46566a">─── après choix d&#x27;une action ───</text>
<text x="940" y="229" font-size="11.5" fill="#46566a">Étapes ● Cible ● Flotte ○ Unités ○ Vérifier</text>
<text x="940" y="246" font-size="11.5" fill="#46566a">3. Flotte : cartes radio (lieu, unités adaptées)</text>
<text x="940" y="263" font-size="11.5" fill="#46566a">4. Unités : toutes par défaut, − / + </text>
<text x="940" y="280" font-size="11.5" fill="#46566a">5. Résumé serveur : sauts, étapes, durée,</text>
<text x="940" y="297" font-size="11.5" fill="#46566a">   arrivée, carburant, bataille, « à savoir »</text>
<text x="940" y="314" font-size="11.5" fill="#46566a">6. [ Confirmer : déplacer une flotte ]</text>
<text x="940" y="331" font-size="11.5" fill="#46566a">Échap ou [Annuler] revient aux actions</text>
<rect x="190" y="680" width="1070" height="100" rx="6" fill="#f4f6f8" stroke="#8a97a6" stroke-width="1.2"/>
<text x="200" y="700" font-size="13" font-weight="700" fill="#1d2b3a">Vos flottes (dock) — où, quoi, vers où</text>
