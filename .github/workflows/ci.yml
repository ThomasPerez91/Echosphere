name: CI
on:
  push:
    branches: [master, 'work/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
        working-directory: .
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke_compose.py
      - if: always()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
